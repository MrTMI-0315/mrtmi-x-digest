<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.url == "/" %}{{ site.title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* morning-wire 토큰을 그대로 가져옴 */
:root {
  --bg: #ffffff; --paper: #f2f2f2; --line: #e6e6e6; --ink: #0a0a0a; --muted: #666666;
  --field: #0a0a0a; --field-ink: #ffffff; --field-muted: #a6a6a6;
  --m: clamp(16px, 2vw, 28px);
  --pad: clamp(40px, 4.5vw, 72px);
  --gap: clamp(72px, 8vw, 128px);
  --s-small: clamp(0.8125rem, 0.79rem + 0.1vw, 0.875rem);
  --s-body: clamp(1.0625rem, 1rem + 0.25vw, 1.1875rem);
  --s-lead: clamp(1.25rem, 1.1rem + 0.7vw, 1.625rem);
  --s-head: clamp(2rem, 1.3rem + 3.2vw, 4rem);
  --s-display: 9.6vw;
  --f-latin: "Archivo", "Pretendard Variable", "Noto Sans KR", system-ui, sans-serif;
  --f-ko: "Pretendard Variable", "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --ease-expo: cubic-bezier(0.16, 1, 0.3, 1);
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 var(--s-body)/1.6 var(--f-ko);
  word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
p, ul, ol, h1, h2, h3 { margin: 0; }
ul, ol { list-style: none; padding: 0; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 0.06em; text-underline-offset: 0.2em; }
strong, b { font-weight: 500; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

.col { padding: 0 var(--m) 0 var(--pad); }

/* hero: 워드마크 */
.hero { padding-top: var(--m); }
.top { display: flex; justify-content: space-between; align-items: center; min-height: 44px; font-size: var(--s-small); color: var(--muted); }
.top nav { display: flex; gap: 0 22px; }
.top a { min-height: 44px; display: inline-flex; align-items: center; color: var(--ink); font-weight: 500; text-decoration: none; }
.mark { margin: 12vh 0 0 calc(-0.05em); font: 400 var(--s-display)/0.8 var(--f-latin); letter-spacing: -0.04em; white-space: nowrap; }
.mark a { text-decoration: none; }

/* 본문 */
.doc { max-width: 820px; padding-bottom: var(--gap); }
.doc h1 { margin-top: 48px; font: 500 var(--s-lead)/1.35 var(--f-ko); }
.doc h1 + p, .doc > p { margin-top: 10px; font-size: var(--s-small); color: var(--muted); }
.doc h2 { padding-top: var(--gap); margin-bottom: 20px; font: 500 var(--s-head)/1.05 var(--f-ko); letter-spacing: -0.025em; }
.doc h2::before { content: ""; display: inline-block; width: 0.24em; height: 0.24em; margin-right: 0.22em; vertical-align: 0.24em; border-radius: 50%; background: var(--c, var(--ink)); }
.doc h2#ai { --c: #2f5bd8; }
.doc h2#robotics { --c: #1c8a55; }
.doc h2#insights { --c: #7d4cdb; }
.doc h2#worlds { --c: #e9b21b; }
.doc li { padding: 16px 0; border-top: 1px solid var(--line); }
.doc li:last-child { border-bottom: 1px solid var(--line); }
.doc li strong:first-child { display: block; font-size: var(--s-small); color: var(--muted); font-weight: 500; }
.doc li a { font-size: var(--s-small); color: var(--muted); }
.doc li a:hover { color: var(--ink); }

/* 첫 화면: 날짜 목록 */
.ix { margin-top: 48px; }
.ix-lead { font: 400 var(--s-lead)/1.45 var(--f-ko); max-width: 22em; }
.ix-tips { display: inline-flex; align-items: center; min-height: 48px; margin-top: 28px; padding: 0 22px; background: var(--ink); color: var(--bg); font: 500 var(--s-small)/1 var(--f-ko); text-decoration: none; }
.ix-h { padding-top: var(--gap); margin-bottom: 20px; font: 500 var(--s-head)/1.05 var(--f-ko); letter-spacing: -0.025em; }
.doc .ix-list li { padding: 0; }
.doc .ix-list a { display: block; padding: 14px 0; color: var(--ink); font: 400 var(--s-head)/1 var(--f-latin); font-stretch: 87.5%; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; text-decoration: none; transition: padding-left 240ms var(--ease-expo); }
.doc .ix-list a:hover { padding-left: 12px; }

/* 푸터 */
.foot { background: var(--field); color: var(--field-ink); padding: var(--m); min-height: 60svh; display: grid; grid-template-rows: auto 1fr auto auto; }
.foot nav { display: flex; flex-wrap: wrap; gap: 0 22px; }
.foot nav a { min-height: 44px; display: inline-flex; align-items: center; font-weight: 500; }
.foot :focus-visible { outline-color: var(--field-ink); }
.foot-mark { grid-row: 3; margin-top: 32px; font: 400 var(--s-display)/0.8 var(--f-latin); letter-spacing: -0.04em; white-space: nowrap; }
.foot-legal { grid-row: 4; margin-top: 28px; font-size: var(--s-small); color: var(--field-muted); max-width: 46em; }

@media (max-width: 699px) {
  .col { padding: 0 var(--m); }
  .mark { margin-top: 28px; font-size: 17vw; }
  .foot { min-height: 0; }
  .foot-mark { font-size: 13vw; }
}
@media (prefers-reduced-motion: no-preference) {
  .mark, .doc h1, .ix { animation: rise 900ms var(--ease-expo) both; }
  .doc h1, .ix { animation-delay: 90ms; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
}
@media (prefers-reduced-motion: reduce) { .ix-list a { transition: none; } }
</style>
</head>
<body>
<header class="hero col">
  <div class="top">
    <span>X 아카이브</span>
    <nav aria-label="사이트"><a href="{{ '/' | relative_url }}">목록</a><a href="{{ '/tips.html' | relative_url }}">팁 모음</a></nav>
  </div>
  <p class="mark"><a href="{{ '/' | relative_url }}">x digest</a></p>
</header>
<main class="col doc">
{{ content }}
</main>
<footer class="foot">
  <nav aria-label="사이트"><a href="{{ '/' | relative_url }}">목록</a><a href="{{ '/tips.html' | relative_url }}">팁 모음</a><a href="#">맨 위로</a></nav>
  <p class="foot-mark" aria-hidden="true">mrtmi x digest</p>
  <p class="foot-legal">X에서 AI · Robotics · Insights 주제로 모은 글의 한 줄 요약과 원문 링크입니다. 원문 저작권은 각 작성자에게 있습니다.</p>
</footer>
</body>
</html>
